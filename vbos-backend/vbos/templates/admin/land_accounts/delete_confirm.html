{% extends "admin/base_site.html" %}
{% load i18n %}
{% block title %}{{ title }} | {{ block.super }}{% endblock %}
{% block content %}
<div id="content-main">
  <p>{% trans "Are you sure you want to delete this land accounts record?" %}</p>
  <p><strong>{{ object }}</strong></p>
  <form method="post">
    {% csrf_token %}
    <div style="margin-top: 20px;">
      <button type="submit" style="background: #ba2121; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">{% trans "Yes, delete" %}</button>
      <a href="{% url 'admin_land_accounts_list' %}" style="margin-left: 12px;">{% trans "Cancel" %}</a>
    </div>
  </form>
</div>
{% endblock %}
